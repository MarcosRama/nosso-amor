<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nossa História</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Juntos Há...</h1>
    
    <!-- Contador -->
    <div id="timer">
      <div><span id="years">0</span><label>Anos</label></div>
      <div><span id="months">0</span><label>Meses</label></div>
      <div><span id="days">0</span><label>Dias</label></div>
      <div><span id="hours">0</span><label>Horas</label></div>
      <div><span id="minutes">0</span><label>Minutos</label></div>
      <div><span id="seconds">0</span><label>Segundos</label></div>
    </div>

    <!-- Mídia: Foto ou Vídeo -->
    <div class="media-container">
      <img src="foto.jpg" alt="Foto do Casal">
      <!-- Caso queira vídeo em vez de imagem, substitua a linha acima por:
      <video autoplay loop muted playsinline src="video.mp4"></video> 
      -->
    </div>

    <!-- Player do Spotify -->
    <div class="<iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/track/6tDBqLL9ucSov84kZH6V1Z?utm_source=generator&si=f1fe510efcc0476c" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>">
      <!-- Substitua o link 'src' abaixo pelo iframe incorporado do seu Spotify -->
      <iframe style="border-radius:12px" 
              src="https://open.spotify.com/embed/track/SUA_MUSICA_AQUI?utm_source=generator" 
              width="100%" height="152" frameborder="0" 
              allowfullscreen="" 
              allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
              loading="lazy">
      </iframe>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
</body>
</html>
