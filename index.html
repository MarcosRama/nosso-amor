<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nossa História</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Nossa História</h1>

    <!-- Contador 1: Primeiro Beijo -->
    <h2>Nosso Primeiro Beijo (18/11/2023)</h2>
    <div id="beijo-timer" class="timer">
      <div><span id="beijo-years">0</span><label>Anos</label></div>
      <div><span id="beijo-months">0</span><label>Meses</label></div>
      <div><span id="beijo-days">0</span><label>Dias</label></div>
      <div><span id="beijo-hours">0</span><label>Horas</label></div>
      <div><span id="beijo-minutes">0</span><label>Minutos</label></div>
      <div><span id="beijo-seconds">0</span><label>Segundos</label></div>
    </div>

    <!-- Contador 2: Início do Caso -->
    <h2>Início do Nosso Caso (30/11/2023)</h2>
    <div id="caso-timer" class="timer">
      <div><span id="caso-years">0</span><label>Anos</label></div>
      <div><span id="caso-months">0</span><label>Meses</label></div>
      <div><span id="caso-days">0</span><label>Dias</label></div>
      <div><span id="caso-hours">0</span><label>Horas</label></div>
      <div><span id="caso-minutes">0</span><label>Minutos</label></div>
      <div><span id="caso-seconds">0</span><label>Segundos</label></div>
    </div>

    <!-- Foto do Casal -->
    <div class="media-container">
      <img src="foto.jpg" alt="Foto do Casal">
    </div>

    <!-- Player do Spotify -->
    <div class="spotify-container">
      <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/track/6tDBqLL9ucSov84kZH6V1Z?utm_source=generator&si=632a548636ae48cf" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
</body>
</html>
